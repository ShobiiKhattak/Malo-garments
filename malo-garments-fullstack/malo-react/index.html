<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Malo Garments — Elegant Women's Fashion</title>
    <meta name="description" content="Discover premium ladies garments and undergarments at Malo Garments." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Set the theme before first paint so there's no flash of the wrong theme:
      // a manually-picked theme (localStorage) wins, otherwise fall back to day/night.
      (function () {
        try {
          var stored = localStorage.getItem('malo_theme');
          if (stored === 'light' || stored === 'dark') {
            document.documentElement.setAttribute('data-theme', stored);
            return;
          }
        } catch (e) {}
        var h = new Date().getHours();
        document.documentElement.setAttribute('data-theme', (h >= 19 || h < 6) ? 'dark' : 'light');
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
